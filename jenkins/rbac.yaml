---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yas-deployer
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yas-deployer
  namespace: yas
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: yas-deployer
  namespace: yas
subjects:
  - kind: ServiceAccount
    name: yas-deployer
    namespace: jenkins
roleRef:
  kind: Role
  name: yas-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped read of nodes (needed to resolve the external NodeIP for the URL).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yas-deployer-nodes-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yas-deployer-nodes-read
subjects:
  - kind: ServiceAccount
    name: yas-deployer
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: yas-deployer-nodes-read
  apiGroup: rbac.authorization.k8s.io
