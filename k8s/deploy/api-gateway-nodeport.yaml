apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx-config
  namespace: yas
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = / {
        return 302 /swagger-ui/;
      }

      location = /swagger-ui {
        return 302 /swagger-ui/;
      }

      location /swagger-ui/ {
        proxy_pass http://swagger-ui.yas.svc.cluster.local:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
      }

      location /product/ {
        proxy_pass http://product.yas.svc.cluster.local:80;
      }

      location /media/ {
        proxy_pass http://media.yas.svc.cluster.local:80;
      }

      location /customer/ {
        proxy_pass http://customer.yas.svc.cluster.local:80;
      }

      location /cart/ {
        proxy_pass http://cart.yas.svc.cluster.local:80;
      }

      location /inventory/ {
        proxy_pass http://inventory.yas.svc.cluster.local:80;
      }

      location /order/ {
        proxy_pass http://order.yas.svc.cluster.local:80;
      }

      location /search/ {
        proxy_pass http://search.yas.svc.cluster.local:80;
      }

      location /tax/ {
        proxy_pass http://tax.yas.svc.cluster.local:80;
      }
    }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api-gateway-nodeport
  namespace: yas
spec:
  healthCheck:
    type: HTTP
    port: 80
    requestPath: /healthz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: yas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: api-gateway-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: yas
  annotations:
    cloud.google.com/backend-config: '{"default":"api-gateway-nodeport"}'
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
