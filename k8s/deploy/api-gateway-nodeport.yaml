apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx-config
  namespace: yas
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      resolver 34.118.224.10 valid=30s ipv6=off;

      set $swagger_ui_upstream http://swagger-ui.yas.svc.cluster.local:8080;
      set $product_upstream http://product.yas.svc.cluster.local:80;
      set $media_upstream http://media.yas.svc.cluster.local:80;
      set $customer_upstream http://customer.yas.svc.cluster.local:80;
      set $cart_upstream http://cart.yas.svc.cluster.local:80;
      set $location_upstream http://location.yas.svc.cluster.local:80;
      set $inventory_upstream http://inventory.yas.svc.cluster.local:80;
      set $order_upstream http://order.yas.svc.cluster.local:80;
      set $payment_upstream http://payment.yas.svc.cluster.local:80;
      set $search_upstream http://search.yas.svc.cluster.local:80;
      set $tax_upstream http://tax.yas.svc.cluster.local:80;
      set $rating_upstream http://rating.yas.svc.cluster.local:80;
      set $promotion_upstream http://promotion.yas.svc.cluster.local:80;
      set $webhook_upstream http://webhook.yas.svc.cluster.local:80;
      set $sampledata_upstream http://sampledata.yas.svc.cluster.local:80;
      set $recommendation_upstream http://recommendation.yas.svc.cluster.local:80;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = / {
        return 302 /swagger-ui/;
      }

      location = /swagger-ui {
        return 302 /swagger-ui/;
      }

      location /swagger-ui/ {
        proxy_pass $swagger_ui_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
      }

      location /product/ {
        proxy_pass $product_upstream;
      }

      location /media/ {
        proxy_pass $media_upstream;
      }

      location /customer/ {
        proxy_pass $customer_upstream;
      }

      location /cart/ {
        proxy_pass $cart_upstream;
      }

      location ~ ^/rating/storefront/ratings/product/[0-9]+/average-star$ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @rating_average_fallback;
        proxy_pass $rating_upstream;
      }

      location ~ ^/rating/storefront/ratings/products/[0-9]+$ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @rating_list_fallback;
        proxy_pass $rating_upstream;
      }

      location /rating/ {
        proxy_pass $rating_upstream;
      }

      location /location/ {
        proxy_pass $location_upstream;
      }

      location /inventory/ {
        proxy_pass $inventory_upstream;
      }

      location /order/ {
        proxy_pass $order_upstream;
      }

      location /payment/ {
        proxy_pass $payment_upstream;
      }

      location /promotion/ {
        proxy_pass $promotion_upstream;
      }

      location /search/ {
        proxy_pass $search_upstream;
      }

      location /webhook/ {
        proxy_pass $webhook_upstream;
      }

      location /sampledata/ {
        proxy_pass $sampledata_upstream;
      }

      location ~ ^/recommendation/embedding/product/[0-9]+/similarity$ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @recommendation_similarity_fallback;
        proxy_pass $recommendation_upstream;
      }

      location /recommendation/ {
        proxy_pass $recommendation_upstream;
      }

      location /tax/ {
        proxy_pass $tax_upstream;
      }

      location @rating_average_fallback {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '0';
      }

      location @rating_list_fallback {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"ratingList":[],"totalPages":0,"totalElements":0}';
      }

      location @recommendation_similarity_fallback {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '[]';
      }
    }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api-gateway-nodeport
  namespace: yas
spec:
  healthCheck:
    type: HTTP
    port: 80
    requestPath: /healthz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: yas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: api-gateway-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: yas
  annotations:
    cloud.google.com/backend-config: '{"default":"api-gateway-nodeport"}'
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
