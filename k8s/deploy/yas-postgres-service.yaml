# DNS alias so YAS apps in namespace `yas` can reach Zalando Postgres in `postgres`.
# Backend charts use jdbc:postgresql://postgres:5432/<database>.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: yas
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database-alias
spec:
  type: ExternalName
  externalName: postgresql.postgres.svc.cluster.local
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
