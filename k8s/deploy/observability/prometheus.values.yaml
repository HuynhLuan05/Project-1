hostname: &hostname grafana.yas.local.com
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
grafana:
  grafana.ini:
    database:
      # type: postgres
      # host: postgresql.postgres:5432
      # name: grafana
      # user: yasadminuser
      # password: admin
      # ssl_mode: require
  adminUser: admin
  adminPassword: admin
  ingress:
    ingressClassName: gce
    enabled: true
    annotations:
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.allow-http: "true"
    hosts:
      - *hostname
