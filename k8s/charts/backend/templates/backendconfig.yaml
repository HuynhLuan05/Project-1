{{- if .Values.backendConfig.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  healthCheck:
    type: HTTP
    port: {{ .Values.backendConfig.healthCheckPort }}
    requestPath: {{ .Values.backendConfig.healthCheckPath }}
{{- end }}
