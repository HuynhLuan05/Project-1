apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- if .Values.backendConfig.enabled }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ include "backend.fullname" . }}"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.metricPort }}
      targetPort: metric
      protocol: TCP
      name: metric
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
