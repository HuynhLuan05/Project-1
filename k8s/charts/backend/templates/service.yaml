apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- $annotations := dict }}
  {{- with .Values.service.annotations }}
  {{- $annotations = merge $annotations . }}
  {{- end }}
  {{- if .Values.gceBackendConfig.enabled }}
  {{- $_ := set $annotations "cloud.google.com/backend-config" (printf "{\"default\": %q}" (default (include "backend.fullname" .) .Values.gceBackendConfig.name)) }}
  {{- end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.metricPort }}
      targetPort: metric
      protocol: TCP
      name: metric
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
