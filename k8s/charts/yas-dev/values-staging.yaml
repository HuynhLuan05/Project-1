# Main values file for yas-staging umbrella chart.

# ── BFF Services ──
storefront-bff:
  backend:
    fullnameOverride: storefront-bff-staging
    serviceAccount:
      create: true
    image:
      tag: "latest"        
backoffice-bff:
  backend:
    fullnameOverride: backoffice-bff-staging
    serviceAccount:
      create: true
    image:
      tag: "latest"        

# ── UI Services ──
storefront-ui:
  ui:
    image:
      tag: "latest"

backoffice-ui:
  ui:
    image:
      tag: "latest"

# ── API Documentation ──
swagger-ui:
  image:
    tag: "v4.16.0"

# ── Backend Services ──
product:
  backend:
    image:
      tag: "latest"        

media:
  backend:
    image:
      tag: "latest"

cart:
  backend:
    image:
      tag: "latest"

order:
  backend:
    image:
      tag: "latest"

customer:
  backend:
    image:
      tag: "latest"

inventory:
  backend:
    image:
      tag: "latest"

location:
  backend:
    image:
      tag: "latest"

payment:
  backend:
    image:
      tag: "latest"

promotion:
  backend:
    image:
      tag: "latest"

rating:
  backend:
    image:
      tag: "latest"

search:
  backend:
    image:
      tag: "latest"

tax:
  backend:
    image:
      tag: "latest"

webhook:
  backend:
    image:
      tag: "latest"

# ── Infrastructure overrides for Staging (Avoid NodePort conflicts with Dev) ──
database:
  service:
    nodePort: 30107

jaeger:
  service:
    otlpGrpcNodePort: 30117
    otlpHttpNodePort: 30118