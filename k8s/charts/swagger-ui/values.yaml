# Default values for swagger-ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: swaggerapi/swagger-ui
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # v5+ supports OpenAPI 3.1; keep v5 even when APIs emit 3.0 for older browser caches.
  tag: "v5.18.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Bump path segment after upgrading Swagger UI image so browsers skip cached v4 static files.
baseUrl: /swagger-ui

# Base URL for OpenAPI specs — must match how browsers reach the API (port 80, no NodePort).
# Users add api.yas.local.com to /etc/hosts pointing at the GCE yas-ingress LB IP.
apiDocsBaseUrl: http://api.yas.local.com

apiDocsServices:
  - { name: Product, path: product }
  - { name: Media, path: media }
  - { name: Customer, path: customer }
  - { name: Cart, path: cart }
  - { name: Rating, path: rating }
  - { name: Order, path: order }
  - { name: Payment, path: payment }
  - { name: Location, path: location }
  - { name: Inventory, path: inventory }
  - { name: Tax, path: tax }
  - { name: Promotion, path: promotion }
  - { name: Search, path: search }

service:
  type: ClusterIP
  port: 8080

# GCE ingress health checks hit / by default; swagger-ui only serves under /swagger-ui.
backendConfig:
  enabled: true
  healthCheckPath: /swagger-ui/

ingress:
  enabled: true
  className: "nginx"
  host: api.yas.local.com
  annotations: {}
  hosts:
    - host: api.yas.local.com
      paths:
        - path: /swagger-ui
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
