name: backoffice service ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "backoffice/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/backoffice-ci.yaml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backoffice/**"
      - ".github/workflows/actions/action.yaml"
      - ".github/workflows/backoffice-ci.yaml"
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      FROM_ORIGINAL_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backoffice
      - run: npm run build
        working-directory: backoffice
      - run: npm run lint
        working-directory: backoffice
      - run: npx prettier --check .
        working-directory: backoffice
      - run: npm audit --omit=dev
        continue-on-error: true
        working-directory: backoffice
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: './backoffice'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: SonarCloud Scan
        if: ${{ env.FROM_ORIGINAL_REPOSITORY == 'true' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: backoffice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice
          load: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yas-backoffice:${{ github.sha }}
      - name: Run Trivy vulnerability scanner
        if: ${{ github.event_name == 'push' }}
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yas-backoffice:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Push Docker SHA image
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./backoffice
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yas-backoffice:${{ github.sha }}
      - name: Push Docker release image
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./backoffice
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yas-backoffice:${{ github.ref_name }}
      - name: Push Docker latest image
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./backoffice
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yas-backoffice:latest
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
